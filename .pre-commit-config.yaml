# Hooks run the same tools as `make lint typecheck` via the locked uv environment,
# so local hooks and CI never disagree on tool versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # demo/slugkit.fi is git fast-export output, kept byte-exact (a test checks it).
      - id: end-of-file-fixer
        exclude: ^demo/slugkit\.fi$
      - id: trailing-whitespace
        exclude: ^demo/slugkit\.fi$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, src)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
